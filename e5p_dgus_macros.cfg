# e5p-dgus: Klipper macros for the touchscreen
# Included from printer.cfg with:   [include e5p_dgus_macros.cfg]
# (install.sh can add that line for you)
#
# Uses action_respond_info, so no [respond] section is needed. The e5p-dgus
# service watches Klipper's console and plays the sound on the screen.

[gcode_macro M300]
description: Beep on the touchscreen. S=frequency (Hz), P=duration (ms)
gcode:
  {% set s = params.S|default(1000)|int %}
  {% set p = params.P|default(100)|int %}
  {action_respond_info("e5p_dgus:beep S=%d P=%d" % (s, p))}

[gcode_macro SCREEN_SOUND]
description: Play a sound stored on the touchscreen. SOUND=index [VOLUME=0-100]
gcode:
  {% set n = params.SOUND|default(3)|int %}
  {% set v = params.VOLUME|default(-1)|int %}
  {% if v >= 0 %}
    {action_respond_info("e5p_dgus:sound %d V=%d" % (n, v))}
  {% else %}
    {action_respond_info("e5p_dgus:sound %d" % n)}
  {% endif %}
